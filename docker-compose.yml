services:
  identity:
    build: .
    environment:
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=pantry_identity;Username=pantry;Password=pantry"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_identity
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev
    environment:
      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # Initial admin credentials (Keycloak 26+ syntax)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Hostname settings for local development
      KC_HOSTNAME: localhost
      KC_HEALTH_ENABLED: "true"
    ports:
      - "11384:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-data: